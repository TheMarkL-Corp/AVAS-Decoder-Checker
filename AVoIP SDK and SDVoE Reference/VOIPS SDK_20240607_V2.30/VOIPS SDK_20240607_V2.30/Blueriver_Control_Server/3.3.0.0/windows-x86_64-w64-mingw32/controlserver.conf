##############################################################################
# Configuration file for SDVoE Control Server
#
# Every line beginning with "#" is a comment line.
# There is one option per line.
##############################################################################

#######################################################################
# Log File
#######################################################################
# Path to the log file. If a relative path is provided, it is relative to
# the current working directory.
#
# Make sure the parent folder already exists. It will not be created.
logfile_path         = controlserver.log

# Log severity level for the log file, stderr and stdout, respectively. There
# is usually no reason to log to both standard output (stdout) and standard
# error (stderr) at the same time.
#
# Allowed values, in decreasing order of severity:
#   NONE (no message will be logged/printed)
#   ERROR
#   WARNING
#   MESSAGE or DEFAULT
#   VERBOSE
#   DEBUG (Not for production use, log file will grow fast)
#   TRACE (Not for production use, log file will grow *very* fast)
logfile_log_level    = MESSAGE
stderr_log_level     = MESSAGE
stdout_log_level     = NONE

#######################################################################
# Firmware Update
#######################################################################
# Path to a directory that contains firmware files (.apz files) for
# firmware update. If a relative path is provided, it is relative to
# the current working directory.
#
# Limitation: it is not possible to specify a relative path that goes up by
# more than one directory level (i.e. ../../update is not supported).
firmware_path =update

# Maximum number of devices that can have their firmware updated at the same
# time. Other devices will wait for their turn.
max_concurrent_updates = 64

#######################################################################
# Multicast Addresses
#######################################################################
# All IP addresses in this section must be in the [224.0.2.0, 239.255.255.255]
# range.

# IP address range to use for multicast channel allocations
multicast_range_start = 224.1.1.1
multicast_range_end = 224.1.3.255

# The all TX and all RX addresses are reserved multicast IP addresses that are
# used for device control and cannot be used for multicast channel allocations
# (i.e. to transport video or audio). These two addresses can be anywhere in the
# [224.0.2.0, 239.255.255.255] range (inside or outside the allocations range).
#
# The legacy values for these addresses are the following:
#   all TX: 224.1.1.253
#   all RX: 224.1.1.254
# It is permissible to use these legacy values but they cannot be swapped (i.e.
# the all TX address cannot be configured to the legacy all RX address and vice
# versa).
#
# The legacy all TX and all RX addresses are always reserved (in addition to the
# configured ones if they differ).
multicast_all_tx = 224.1.1.253
multicast_all_rx = 224.1.1.254

#######################################################################
# Local ports and addresses
#######################################################################
# These configuration parameters allows the server to bind specific local port
# and addresses. This is useful on servers with multiple network interfaces,
# when is desirable to only listen for connections on one of these addresses.
#
# Local IP address on which to listen for client connections (text command TCP
# and REST API HTTP). The default (0.0.0.0) is to listen on all local addresses.
client_address          = 0.0.0.0

# Windows only: Local IP address for communication with SDVoE devices. The
# default (0.0.0.0) means all local addresses.
#
# Must be set to 0.0.0.0 on platforms other than Microsoft Windows.
device_address          = 0.0.0.0

# Whether to enable support for TCP text command (aka. "Telnet") clients.
enable_tcp              = yes

# Local TCP port on which to listen for TCP text command client connections.
# This is ignored if TCP text command client support is disabled by setting
# enable_tcp to no.
client_port             = 6970

# REST API over HTTP or HTTPS. Select one of the following:
#
#   DISABLED    Disable the REST API.
#   UNSECURED   Enable the REST API over HTTP.
#   SECURE      Enable the REST API over TLS-secured HTTP (aka. HTTPS).
#
# Enabling the REST API over HTTPS requires setting at least a server
# certificate and private key. Client authentication using certificates is
# also supported but requires additional configuration. See the TLS Security
# section below.
enable_http             = UNSECURED

# Local TCP port for REST API over HTTP (without TLS). This is ignored if
# support is disabled by setting enable_http to anything other than USECURED.
#
# The default TCP port number for HTTP defined in RFC 7230 section 2.7.1 is 80.
http_port               = 80

# Local TCP port for REST API over TLS-secured HTTP (aka. HTTPS). This is
# ignored if support is disabled by setting enable_http to anything other
# than SECURE.
#
# The default TCP port number for TLS-secured HTTP defined in RFC 7230 section
# 2.7.2 is 443.
https_port              = 443

#######################################################################
# HTTP Settings
#######################################################################
# The HTTP host for this server. This must be an actual host name, not an IP
# address.
#
# This parameter is optional: specify a single asterisk (*) to allow requests to
# any host name or to the server's IP address.
http_host               = *

# Whether REST API responses are minified by default. If this parameter is "no",
# then responses (in JSON format) are indented for better readability.
#
# This parameter sets a global default. Clients can override this setting on a
# per-request basis using the "human" query argument.
http_minify             = no

# A space-separated list of allowed origins for Cross-Origin Resource Sharing
# (CORS). Each element must be either 1) a valid origin, with scheme, host and,
# if other than the default, port; or 2) null.
#
# Leave empty to prevent any cross-origin request.
#
# Specify a single asterisk (*) instead of an origin list to allow cross-origin
# requests from any origin (not recommended). 
#
# Examples:
# http_cors_origins =
# http_cors_origins = *
# http_cors_origins = http://example.com
# http_cors_origins = http://localhost:8000 http://127.0.0.1:8000
# http_cors_origins = http://localhost null
#
# This parameter is only relevant to HTTP requests generated from active content
# (i.e. JavaScript) in a web browser.
#
# See the Cross-Origin Resource Sharing W3C recommendation and RFC 6454 for
# detail:
#   https://www.w3.org/TR/cors/
#   https://tools.ietf.org/html/rfc6454
#
http_cors_origins       =

# Value returned in the Access-Control-Max-Age HTTP header field. This controls
# the amount of time, in seconds, that the result of a Cross-Origin Resource
# Sharing (CORS) preflight request is cached by the client. Must be between 0
# and 86400 (24 hours).
#
# This parameter is only relevant to HTTP requests generated from active content
# (i.e. JavaScript) in a web browser.
#
# See the Cross-Origin Resource Sharing W3C recommendation and RFC 6454 for
# detail:
#   https://www.w3.org/TR/cors/
#   https://tools.ietf.org/html/rfc6454
#
http_cors_max_age       = 60

#######################################################################
# TLS Security
#######################################################################
# All options in this section are only relevant if support for the REST API over
# TLS-secured HTTP has been enabled by setting enable_https to yes. Otherwise,
# they are ignored.

# Full path and name of the file that contains the server certificate.
#
# The file must be in PEM format. It must at least contain the server's own
# certificate. Optionally, it can also contain the complete certificate chain,
# including certificate authority (CA) certificates. If it does, the
# certificates must be sorted from leaf to root (i.e. the server's own
# certificate comes first and the root CA certificate comes last).
#
# If this file does not contain the complete certificate chain, then
# tls_ca_cert_file must be specified. The CA certificates will be looked
# up in this file.
tls_server_cert         = server.pem

# Full path and name of the file that contains the server's private key. The
# file must be encoded in PEM format.
tls_private_key         = key.pem

# Whether clients are required to authenticate themselves by providing a client
# certificate.
#
# Client authentication is a standard but optional step of the TLS handshake,
# contrary to server authentication which is mandatory. It allows the server
# to authenticate clients and ensure they are authorized to access the server.
tls_require_client_cert = no

# Full path and name of a file that contains certificate authority (CA)
# certificates trusted by this server. This must be specified if either of these
# situations applies:
#
#   - Certificate-based client authentication is enabled by setting the
#     tls_require_client_cert option to yes. A client is allowed access if
#     its certificate is signed by one of the trusted CAs.
#   - The server certificate specified by tls_server_cert does not contain the
#     full certificate chain. The missing CA certificates are looked up among
#     the set of trusted CAs defined here.
#
# The CA certificates must be encoded in PEM format. Multiple certificates can
# be concatenated into a single file.
tls_ca_cert_file       = 

# TLS cipher list. This is a string that specify the ciphers the server will
# allow during TLS negotiation.
#
# The syntax is described here:
#   https://www.openssl.org/docs/man1.1.1/man1/ciphers.html
#
# Keeping the default is recommended. This is configurable so it can be adapted
# for backward compatibility with legacy clients or to comply with specific
# security policies.
tls_cipher_list         = ALL:!COMPLEMENTOFDEFAULT:!eNULL:!SHA1

#######################################################################
# Security
#######################################################################
# Secret string unique to this API server installation.
#
# To enable the device claiming feature of the SDVoE API, uncomment the line
# below and set the value to a unique, unpredictable, randomly-generated string.
# All ASCII characters are allowed. For maximum security, set to a random string
# of 50 characters that contains at least lower case and upper case letters as
# well as numbers.
#
# For security reasons, if you uncomment this line but keep the example default
# string (i.e. t=%abq!AWC>BV<t>tHtPasVk9['FeUsmh_c_bhJz/NDsP4:DqP), the server
# will refuse to start. You need to actually set a unique value.
#
# If you are replacing the API server in an existing installation, set the same
# value as the original API server to be able to control devices claimed by
# the original with the replacement.
#
# Important notes:
# * Keep this value secret. If it is leaked, an adversary can run its own API
#   server and have it impersonate this server, which allows it to control
#   claimed devices.
# * Keep a record of this string. If you lose it and need to replace the API
#   server (e.g. because of a failed hard disk), then the only way to get back
#   control of the devices claimed by the failed server is to physically
#   perform a factory reset on each device.
# * It is highly recommended to enable this feature as unclaimed devices on your
#   network can be claimed by an adversary running their own API server.
#server_secret          = t=%abq!AWC>BV<t>tHtPasVk9['FeUsmh_c_bhJz/NDsP4:DqP

#######################################################################
# Secure communication
#######################################################################
# Default secret encryption key phrase to be shared between instances of 
# secured API server installations.
# 
# To enable encrypted communication between the API and network devices,
# uncomment the line below and set the value to a unique, unpredictable,
# randomly-generated string.
# All ASCII characters are allowed. For maximum security, set to a random string
# of 64 characters that contains at least lower case and upper case letters as
# well as numbers.
#
# Important notes:
# * Keep this value secret. If it is leaked, an adversary can run its own API
#   server and have it impersonate this server, which allows it to control
#   secured devices.
# * Keep a record of this string. If you lose it and need to replace the API
#   server (e.g. because of a failed hard disk), then the only way to get back
#   control of the devices secured by the failed server is to physically
#   perform a factory reset on each device.
# * It is highly recommended to enable this feature as unsecured devices on
#   your network can be secured by an adversary running their own API server.
#secure_comm_secret             = Tq8AEXDDPS49qrDuK5X!%lkj<LBBMR

# Default secret encryption key phrases to be used to encrypt network data streams
# between devices supporting such data streams.

#usb_hid_encryption_default_key = nRAENMxzHhzZe!!22sr<`DTejvCT%z
